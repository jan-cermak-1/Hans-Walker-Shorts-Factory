name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build macOS App
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
          
      - name: Build app
        run: |
          cd source-codes
          xcodebuild -project VideoShortsFactory.xcodeproj \
            -scheme VideoShortsFactory \
            -configuration Release \
            -derivedDataPath build \
            clean archive \
            -archivePath build/VideoShortsFactory.xcarchive
            
      - name: Export app
        run: |
          cd source-codes
          xcodebuild -exportArchive \
            -archivePath build/VideoShortsFactory.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist exportOptions.plist
            
      - name: Create DMG
        run: |
          brew install create-dmg
          create-dmg \
            --volname "Hans Walker Shorts Factory" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "Hans Walker Shorts Factory.app" 200 190 \
            --hide-extension "Hans Walker Shorts Factory.app" \
            --app-drop-link 600 185 \
            "releases/Hans-Walker-Shorts-Factory-${{ github.ref_name }}.dmg" \
            "source-codes/build/export/Hans Walker Shorts Factory.app"
            
      - name: Create ZIP
        run: |
          cd source-codes/build/export
          zip -r "../../../releases/Hans-Walker-Shorts-Factory-${{ github.ref_name }}.app.zip" "Hans Walker Shorts Factory.app"
          
      - name: Generate checksums
        run: |
          cd releases
          md5 Hans-Walker-Shorts-Factory-${{ github.ref_name }}.dmg > checksums-md5.txt
          md5 Hans-Walker-Shorts-Factory-${{ github.ref_name }}.app.zip >> checksums-md5.txt
          shasum -a 256 Hans-Walker-Shorts-Factory-${{ github.ref_name }}.dmg > checksums-sha256.txt
          shasum -a 256 Hans-Walker-Shorts-Factory-${{ github.ref_name }}.app.zip >> checksums-sha256.txt
          
      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            releases/*.dmg
            releases/*.zip
            releases/checksums-*.txt
          body: |
            ## Hans Walker Shorts Factory ${{ github.ref_name }}
            
            ### Downloads
            - **DMG Installer** (Recommended for most users)
            - **ZIP Archive** (For advanced users)
            
            ### What's New
            See [CHANGELOG.md](CHANGELOG.md) for details.
            
            ### System Requirements
            - macOS 13.0 (Ventura) or later
            - Apple Silicon (M1/M2/M3) or Intel
            - 4GB RAM minimum (8GB recommended)
            
            ### Installation
            1. Download the DMG file
            2. Open and drag to Applications
            3. Launch from Applications folder
            
            ---
            Made with ❤️ for creators
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
